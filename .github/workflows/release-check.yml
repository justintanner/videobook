name: Release check

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Gate and smoke-test the videobook package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install application and server workspace dependencies
        run: npm ci
      - name: Check that the tag matches the package version and changelog
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./server/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match server/package.json version $version" >&2
            exit 1
          fi
          node scripts/changelog-section.mjs "$version"
      - name: Check dead code and dependencies
        run: npm run check:dead-code
      - name: Typecheck test projects
        run: npm run typecheck:test
      - name: Run strict lint and client build
        run: npm run build
      - name: Build server
        run: npm run build:server
      - name: Run maintained unit tests
        run: npm run test:ci
      - name: Pack, install globally, and smoke-test the CLI under npm 12
        run: npm run test:pack-install -- --npm12 --artifact-dir "$RUNNER_TEMP/pack"
      - name: Upload the tested package
        uses: actions/upload-artifact@v4
        with:
          name: videobook-npm-package
          path: ${{ runner.temp }}/pack/*.tgz
