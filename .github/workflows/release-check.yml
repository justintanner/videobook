name: Release check

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    name: Gate and smoke-test the videobook package
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Cache pinned ffmpeg and yt-dlp binaries
        uses: actions/cache@v4
        with:
          path: ci/media-bins
          key: media-bins-${{ hashFiles('scripts/ci-media-bins.mjs', 'scripts/ci-install.mjs') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install application and server workspace dependencies
        run: node scripts/ci-install.mjs
      - name: Check that the tag matches the package version and changelog
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./server/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match server/package.json version $version" >&2
            exit 1
          fi
          node scripts/changelog-section.mjs "$version"
      - name: Check dead code and dependencies
        run: npm run check:dead-code
      - name: Typecheck test projects
        run: npm run typecheck:test
      - name: Run strict lint and client build
        run: npm run build
      - name: Build server
        run: npm run build:server
      - name: Run maintained unit tests
        run: npm run test:ci
      - name: Pack, install globally, and smoke-test the CLI under npm 12
        run: npm run test:pack-install -- --npm12 --artifact-dir "$RUNNER_TEMP/pack"
        env:
          FFMPEG_BIN: ${{ github.workspace }}/node_modules/ffmpeg-static/ffmpeg
      - name: Upload the tested package
        uses: actions/upload-artifact@v4
        with:
          name: videobook-npm-package
          path: ${{ runner.temp }}/pack/*.tgz

  windows-smoke:
    name: Smoke-test the videobook package on Windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache pinned ffmpeg and yt-dlp binaries
        uses: actions/cache@v4
        with:
          path: ci/media-bins
          key: media-bins-${{ hashFiles('scripts/ci-media-bins.mjs', 'scripts/ci-install.mjs') }}-${{ runner.os }}-${{ runner.arch }}
      - name: Provide pinned ffmpeg for package install scripts
        run: node scripts/ci-ffmpeg-bin.mjs
        env:
          VIDEOBOOK_CI_FFMPEG_DEST: ${{ github.workspace }}/ci/media-bins-active/ffmpeg.exe
      - name: Pack, install globally, and smoke-test the CLI under npm 12
        run: npm run test:pack-install -- --npm12
        env:
          FFMPEG_BIN: ${{ github.workspace }}/ci/media-bins-active/ffmpeg.exe
