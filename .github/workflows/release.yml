name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every gate and npm publish --dry-run without publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Gate, pack, and publish videobook
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: 'https://registry.npmjs.org'
      - name: Install application and server workspace dependencies
        run: npm ci
      - name: Check that the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./server/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match server/package.json version $version" >&2
            exit 1
          fi
      - name: Extract release notes from the changelog
        if: github.event_name == 'push'
        run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"
      - name: Check dead code and dependencies
        run: npm run check:dead-code
      - name: Typecheck test projects
        run: npm run typecheck:test
      - name: Run strict lint and client build
        run: npm run build
      - name: Build server
        run: npm run build:server
      - name: Run maintained unit tests
        run: npm run test:ci
      - name: Pack, install globally, and smoke-test the CLI
        run: npm run test:pack-install -- --npm12 --artifact-dir "$RUNNER_TEMP/pack"
      - name: Upload the tested package
        uses: actions/upload-artifact@v4
        with:
          name: videobook-npm-package
          path: ${{ runner.temp }}/pack/*.tgz
      - name: Publish to npm
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP"/pack/videobook-*.tgz --access public --tag latest
      - name: Publish to npm (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP"/pack/videobook-*.tgz --access public --tag latest --dry-run
      - name: Create the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/pack/videobook-*.tgz
          --title "videobook ${GITHUB_REF_NAME#v}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
