name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint, build, and unit test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install application and server workspace dependencies
        run: npm ci
      - name: Check dead code and dependencies
        run: npm run check:dead-code
      - name: Typecheck test projects
        run: npm run typecheck:test
      - name: Run strict lint and client build
        run: npm run build
      - name: Build server
        run: npm run build:server
      - name: Run maintained unit tests
        run: npm run test:ci
