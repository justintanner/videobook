<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <meta
      name="description"
      content="Notebook-first multimodal creation with revisioned images, video, prompts, characters, and scenes"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #030907;
      }

      #startup-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        color: #557764;
        background: #030907;
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.08em;
        text-align: center;
      }

      #startup-shell strong {
        color: #72e7aa;
        font-family: 'Rajdhani', sans-serif;
        font-size: 24px;
        letter-spacing: 0.16em;
      }

      #startup-shell span {
        font-size: 11px;
        text-transform: uppercase;
      }

      #root:not(:empty) + #startup-shell {
        display: none;
      }
    </style>
    <title>VIDEOBOOK</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup-shell" role="status" aria-live="polite">
      <strong>VIDEOBOOK</strong>
      <span>Loading workspace…</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
