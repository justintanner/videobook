<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <meta
      name="description"
      content="Notebook-first multimodal creation with revisioned images, video, prompts, characters, and scenes"
    />
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #030907;
      }

      #startup-shell {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 10px;
        color: #557764;
        background: #030907;
        font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
        letter-spacing: 0.08em;
        text-align: center;
      }

      #startup-shell strong {
        color: #72e7aa;
        font-family: 'Rajdhani', sans-serif;
        font-size: 24px;
        letter-spacing: 0.16em;
      }

      #startup-shell span {
        font-size: 11px;
        text-transform: uppercase;
      }

      #startup-signal {
        position: relative;
        width: 180px;
        height: 3px;
        margin: 4px auto 2px;
        overflow: hidden;
        background: rgba(114, 231, 170, 0.12);
      }

      #startup-signal::after {
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        background: linear-gradient(90deg, transparent, #72e7aa, #63c7d8, transparent);
        box-shadow: 0 0 12px rgba(114, 231, 170, 0.6);
        content: '';
        animation: startup-scan 1.35s ease-in-out infinite;
      }

      #startup-shell strong {
        animation: startup-breathe 1.8s ease-in-out infinite;
      }

      @keyframes startup-scan {
        from { transform: translateX(-110%); }
        to { transform: translateX(350%); }
      }

      @keyframes startup-breathe {
        0%, 100% { opacity: 0.72; text-shadow: 0 0 0 transparent; }
        50% { opacity: 1; text-shadow: 0 0 18px rgba(114, 231, 170, 0.35); }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-signal::after,
        #startup-shell strong {
          animation: none;
        }

        #startup-signal::after {
          left: 29%;
        }
      }

      #root:not(:empty) + #startup-shell {
        display: none;
      }
    </style>
    <title>VIDEOBOOK</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup-shell" role="status" aria-live="polite">
      <strong>VIDEOBOOK</strong>
      <div id="startup-signal" aria-hidden="true"></div>
      <span>Loading workspace via MCP…</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
